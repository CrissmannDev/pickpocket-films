<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portafolio — PickPocket Films</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    .page-hero {
      padding: 160px 48px 64px;
      background: #080808;
      position: relative;
    }

    .page-hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .page-eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: clamp(60px, 9vw, 120px);
      letter-spacing: 0.04em;
      line-height: 0.95;
      color: var(--white);
    }

    /* FILTER BAR */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 6px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid rgba(201,168,76,0.2);
      color: var(--gray);
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76,0.05);
    }

    /* GALLERY */
    .gallery {
      padding: 0 48px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* FEATURED */
    .featured-row {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 4px;
      margin-bottom: 4px;
    }

    /* MAIN GRID */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }

    .gallery-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    /* PROJECT CARD */
    .project-card {
      position: relative;
      overflow: hidden;
      background: #0d0c0a;
      cursor: pointer;
    }

    .project-card.tall { aspect-ratio: 9/14; }
    .project-card.wide { aspect-ratio: 16/10; }
    .project-card.square { aspect-ratio: 1/1; }
    .project-card.standard { aspect-ratio: 4/3; }
    .project-card.portrait { aspect-ratio: 3/4; }

    .project-bg {
      position: absolute;
      inset: 0;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .project-card:hover .project-bg { transform: scale(1.06); }

    /* Unique color palette for each project */
    .project-card:nth-child(1) .project-bg { background: linear-gradient(135deg, #1a1208 0%, #0a0804 100%); }
    .project-card:nth-child(2) .project-bg { background: linear-gradient(160deg, #0e1218 0%, #080c10 100%); }
    .project-card:nth-child(3) .project-bg { background: linear-gradient(120deg, #100e08 0%, #1a1508 100%); }
    .project-card:nth-child(4) .project-bg { background: linear-gradient(150deg, #080e12 0%, #0c1016 100%); }
    .project-card:nth-child(5) .project-bg { background: linear-gradient(135deg, #121008 0%, #0e0c06 100%); }
    .project-card:nth-child(6) .project-bg { background: linear-gradient(160deg, #0a1010 0%, #080c0c 100%); }
    .project-card:nth-child(7) .project-bg { background: linear-gradient(135deg, #14100a 0%, #100c08 100%); }
    .project-card:nth-child(8) .project-bg { background: linear-gradient(120deg, #0e0810 0%, #0a0610 100%); }
    .project-card:nth-child(9) .project-bg { background: linear-gradient(150deg, #101208 0%, #0c1006 100%); }
    .project-card:nth-child(10) .project-bg { background: linear-gradient(135deg, #160e08 0%, #120c06 100%); }
    .project-card:nth-child(11) .project-bg { background: linear-gradient(160deg, #0a0c14 0%, #080a12 100%); }
    .project-card:nth-child(12) .project-bg { background: linear-gradient(120deg, #0c1208 0%, #0a1006 100%); }

    /* Decorative shapes inside cards */
    .project-deco {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.12;
      transition: opacity 0.4s;
    }

    .project-card:hover .project-deco { opacity: 0.06; }

    .deco-shape {
      width: 40%;
      height: 40%;
      border: 1px solid var(--gold);
    }

    .deco-circle { border-radius: 50%; }
    .deco-diag { transform: rotate(45deg); }

    /* OVERLAY */
    .project-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0) 50%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px;
      transform: translateY(8px);
      transition: transform 0.4s ease;
    }

    .project-card:hover .project-overlay { transform: translateY(0); }

    .proj-category {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .proj-title {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: 0.06em;
      color: var(--white);
      line-height: 1;
      margin-bottom: 6px;
    }

    .proj-year {
      font-family: var(--font-serif);
      font-size: 14px;
      color: var(--gray);
    }

    .proj-arrow {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 16px;
      opacity: 0;
      transform: scale(0.7) rotate(-45deg);
      transition: all 0.35s ease;
    }

    .project-card:hover .proj-arrow {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    /* SMALL CARDS (4th row) */
    .gallery-grid-4 .proj-title { font-size: 20px; }
    .gallery-grid-4 .project-overlay { padding: 18px; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(8,8,8,0.97);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .lightbox.open { opacity: 1; pointer-events: all; }

    .lightbox-content {
      max-width: 800px;
      width: 90%;
      padding: 60px;
      position: relative;
    }

    .lb-close {
      position: absolute;
      top: -20px;
      right: 0;
      background: none;
      border: none;
      color: var(--gold);
      font-size: 24px;
      cursor: pointer;
      font-family: var(--font-body);
      letter-spacing: 0.2em;
      font-size: 11px;
      text-transform: uppercase;
    }

    .lb-frame {
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(201,168,76,0.1);
    }

    .lb-play {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 22px;
    }

    .lb-cat {
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .lb-title {
      font-family: var(--font-display);
      font-size: 52px;
      letter-spacing: 0.05em;
      color: var(--white);
      margin-bottom: 16px;
    }

    .lb-desc {
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 1.7;
      color: var(--cream);
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-links">
      <a href="nosotros.html">Nosotros</a>
      <a href="crew.html">Crew</a>
      <a href="portafolio.html" class="active">Portafolio</a>
      <a href="contacto.html">Contacto</a>
    </div>
    <a href="index.html" class="nav-logo">
     <img src="Images/logo.png" alt="Logo" style="height: 50px;width: auto;">
    </a>
  </nav>

  <div class="page-hero">
    <div class="page-hero-inner">
      <div>
        <p class="page-eyebrow">Trabajo realizado</p>
        <h1 class="page-title">PORTA-<br>FOLIO</h1>
      </div>
    </div>
  </div>

  <!-- React monta la galería y el lightbox aquí — ver react-components.js -->
  <div id="react-portfolio-filter" style="padding: 4px 48px 80px;"></div>

  <footer>
   <img src="Images/logo.png" alt="Logo" style= "height: 50px;width: auto; opacity: 0.7;">
    <div class="footer-copy">© 2026 PickPocket Films. Todos los derechos reservados.</div>
  </footer>

  <script>
    function openLightbox(title, cat, desc) {
      document.getElementById('lb-title').textContent = title;
      document.getElementById('lb-cat').textContent = cat;
      document.getElementById('lb-desc').textContent = desc;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox(e) {
      if (!e || e.target === document.getElementById('lightbox') || e.target.classList.contains('lb-close')) {
        document.getElementById('lightbox').classList.remove('open');
      }
    }

    function filterProjects(btn, cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.project-card').forEach(card => {
        if (cat === 'all' || card.dataset.cat === cat) {
          card.style.opacity = '1';
          card.style.filter = 'none';
        } else {
          card.style.opacity = '0.2';
          card.style.filter = 'grayscale(1)';
        }
      });
    }
  </script>

   <!-- SCROLL ANIMATIONS -->
  <style>
    .reveal { opacity: 0; transform: scale(0.95); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
  </style>
  <script>
    const observerAnim = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) { entry.target.classList.add('visible'); observerAnim.unobserve(entry.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
    document.querySelectorAll('.page-eyebrow, .page-title, .filter-bar, .project-card').forEach(el => {
      el.classList.add('reveal');
      if (el.classList.contains('project-card')) {
        const pos = Array.from(el.parentElement.children).indexOf(el);
        if (pos === 1) el.classList.add('reveal-delay-1');
        if (pos === 2) el.classList.add('reveal-delay-2');
        if (pos === 3) el.classList.add('reveal-delay-3');
      }
      observerAnim.observe(el);
    });
  </script>


  <!-- ─── REACT CDN ─── -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PROYECTOS = [
      { id:1,  nombre:'QUEBRANTO',     categoria:'videoclip', año:2026, ytId:'9Bnhdk9-aAI', img:'Images/quebranto.jpeg' },
      { id:2,  nombre:'CODA',     categoria:'cortometraje',   año:2026, ytId:'' , img:'Images/coda.jpeg'},
      { id:3,  nombre:'LA BAMBA',     categoria:'videoclip',   año:2026, ytId:'', img:'Images/labamba.jpeg' },
      { id:4,  nombre:'ME PROVOCA',     categoria:'videoclip',    año:2025, ytId:'' , img:'Images/me_provoca.jpeg'},
      { id:5,  nombre:'TELOS',  categoria:'cortometraje',  año:2025, ytId:'', img:'Images/telos.jpeg' },
      { id:6,  nombre:'NADA SALE BIEN',      categoria:'videoclip',   año:2025, ytId:'', img:'Images/nadasalebien.jpeg' },
      { id:7,  nombre:'WHY NOT ME', categoria:'videoclip', año:2025, ytId:'', img:'Images/whynotme.jpeg' },
      { id:8,  nombre:'DIAS GRISES', categoria:'videoclip',   año:2024, ytId:'', img:'Images/diasgrises.jpeg' },
      { id:9,  nombre:'DESCANSO',      categoria:'cortometraje',    año:2024, ytId:'', img:'Images/descanso.jpeg'},
      { id:10, nombre:'ROLLING RUANAS LIVE SESSION',   categoria:'live',  año:2025, ytId:'' , img:'Images/livesession.jpeg'},
      
    ];

    const CATEGORIAS = [
      { id:'todos', label:'Todos' }, 
      { id:'cortometraje', label:'Cortometraje' },
       { id:'videoclip',   label:'Videoclip' },
      { id:'live',   label:'Live' },
     
     
    ];

    function ProjectCard({ proyecto, visible, onOpen }) {
      return (
        <div
          className="project-card standard"
          onClick={() => onOpen(proyecto)}
          style={{
            opacity: visible ? 1 : 0.15,
            filter:  visible ? 'none' : 'grayscale(1)',
            transition: 'opacity 0.4s, filter 0.4s',
            cursor: 'pointer'
          }}
        >
          <div className="project-bg">
            <img
              src={proyecto.img} alt={proyecto.nombre} 
              onError={e => e.target.style.display='none'} 
              />
            <div className="project-bg-fallback"></div>
          </div>
          <div className="project-overlay">
            <div className="proj-category">{proyecto.categoria}</div>
            <div className="proj-title">{proyecto.nombre}</div>
            <div className="proj-year">{proyecto.año}</div>
          </div>
          <div className="proj-arrow">↗</div>
        </div>
      );
    }

    function PortfolioFilter() {
      const [filtro,   setFiltro]   = useState('todos');
      const [lightbox, setLightbox] = useState(null);

      useEffect(() => {
        function onKey(e) { if (e.key === 'Escape') setLightbox(null); }
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, []);

      const visible = p => filtro === 'todos' || p.categoria === filtro;
      const count   = PROYECTOS.filter(visible).length;

      return (
        <div>
          <div className="filter-bar">
            {CATEGORIAS.map(cat => (
              <button key={cat.id}
                className={`filter-btn ${filtro === cat.id ? 'active' : ''}`}
                onClick={() => setFiltro(cat.id)}>
                {cat.label}
              </button>
            ))}
          </div>

          <p style={{fontSize:'10px', letterSpacing:'0.2em', textTransform:'uppercase',
            color:'var(--gray)', opacity:0.5, marginBottom:'16px', fontFamily:'var(--font-body)'}}>
            {count} proyecto{count !== 1 ? 's' : ''}{filtro !== 'todos' ? ` · ${filtro}` : ''}
          </p>

          <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'4px', marginBottom:'4px'}}>
            {PROYECTOS.map(p => (
              <ProjectCard key={p.id} proyecto={p} visible={visible(p)} onOpen={setLightbox} />
            ))}
          </div>

          {lightbox && (
            <div className="lightbox open"
              onClick={e => { if (e.target.classList.contains('lightbox')) setLightbox(null); }}>
              <div className="lightbox-content">
                <button className="lb-close" onClick={() => setLightbox(null)}>✕ Cerrar</button>
                <div className="lb-frame">
                  {lightbox.ytId ? (
                    <iframe
                      src={`https://www.youtube.com/embed/${lightbox.ytId}?autoplay=1&rel=0&modestbranding=1`}
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowFullScreen />
                  ) : (
                    <div className="lb-placeholder">Video próximamente</div>
                  )}
                </div>
                <div className="lb-cat">{lightbox.categoria} · {lightbox.año}</div>
                <div className="lb-title">{lightbox.nombre}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('react-portfolio-filter')).render(<PortfolioFilter />);
  </script>

</body>
</html>
